<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Tints the iOS Safari address bar / bottom toolbar so browser chrome blends
         with the page instead of falling back to an opaque black strip.
         Kept in sync with the active theme by useTheme + the inline script below. -->
    <meta name="theme-color" content="#0a0b1a" />
    <title>Ritam Sarkar — Portfolio</title>
    <meta name="description" content="Ritam Sarkar's developer portfolio — full-stack developer building clean, performant web applications." />
    <meta property="og:title" content="Ritam Sarkar — Full-Stack Developer" />
    <meta property="og:description" content="Full-stack developer building clean, performant web applications." />
    <meta property="og:type" content="website" />
    <!-- <meta name="twitter:card" content="summary_large_image" /> -->
    <link rel="icon" type="image/x-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
    <script defer src="https://cdn.devlune.in/embed/analytics.js" data-site="f88b422e-63e0-4098-a89c-3bd09814d0e0"></script>
  </head>

  <script>
    try {
      var t = localStorage.getItem('portfolio-theme');
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', t === 'light' ? '#f0f0f8' : '#0a0b1a');
    } catch(e) {}
  </script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
